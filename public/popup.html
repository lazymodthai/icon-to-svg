<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 240px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1b1b30;
      color: #e0e0e0;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 14px;
      font-weight: 600;
    }
    button {
      display: block;
      width: 100%;
      padding: 10px 0;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background: #6ab0f3;
    }
    button:hover {
      background: #5a9ee3;
    }
    button.outline {
      background: transparent;
      border: 1.5px solid #6ab0f3;
      color: #6ab0f3;
    }
    button.outline:hover {
      background: rgba(106, 176, 243, 0.1);
    }
  </style>
</head>
<body>
  <h2>Icon &rarr; SVG Converter</h2>
  <button id="pick">Pick Image from Page</button>
  <button id="draw">Draw Area</button>
  <button id="open" class="outline">Open Converter</button>
  <script src="popup.js"></script>
</body>
</html>
